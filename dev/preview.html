<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Check it · Panel Preview</title>
<style>
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('fonts/JetBrainsMono[wght].ttf') format('truetype');
    font-weight: 100 800;
    font-style: normal;
    font-display: swap;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #101216;
    color: #e6e8eb;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .stage {
    max-width: 760px;
    margin: 0 auto;
    padding: 64px 40px 120px;
  }

  .hint {
    font-size: 13px;
    color: #6f7681;
    margin-bottom: 28px;
    line-height: 1.6;
  }

  .card {
    background: #1a1d21;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    max-width: 420px;
    color: #e6e8eb;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .card h2 {
    margin: 0 0 8px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.2px;
  }

  .card p {
    margin: 0;
    color: #9aa1ab;
  }

  .btn {
    appearance: none;
    border: 1px solid transparent;
    background: #5e6ad2;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2px;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 32px;
  }

  .title {
    font-size: 28px;
    line-height: 1.3;
    letter-spacing: -0.5px;
    margin: 0 0 12px;
    color: #f7f8f8;
  }

  #delab-preview-bar {
    position: fixed;
    left: 16px;
    bottom: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(20, 22, 26, 0.92);
    border: 1px solid #2a2d33;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    z-index: 100000000;
  }

  #delab-preview-bar .label {
    color: #6f7681;
    margin-right: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  #delab-preview-bar button {
    appearance: none;
    font: inherit;
    color: #c7ccd3;
    background: transparent;
    border: 1px solid #2a2d33;
    border-radius: 5px;
    padding: 3px 8px;
    cursor: pointer;
  }

  #delab-preview-bar button:hover { color: #fff; border-color: #3a3e45; }
  #delab-preview-bar button.active { color: #fff; border-color: #5e6ad2; background: rgba(94, 106, 210, 0.18); }
</style>
</head>
<body>
  <div class="stage">
    <p class="hint">
      面板 UI 预览：左侧按钮切换被检查的 mock 元素，面板里改值会直接作用在它身上。
      <br />这是开发用入口，不依赖 chrome.* API。
    </p>

    <h2 class="title" data-mock="title">Design review, in the browser.</h2>

    <article class="card" data-mock="card">
      <h2>Card title</h2>
      <p>调整右侧面板里的间距、字号、颜色，这个卡片会实时变化。</p>
    </article>

    <button class="btn" data-mock="button">Primary action</button>
  </div>

  <div id="delab-preview-bar">
    <span class="label">Preview</span>
    <button class="active" data-target="title" onclick="window.dispatchEvent(new CustomEvent('delab-preview', { detail: 'title' }))">title</button>
    <button data-target="card" onclick="window.dispatchEvent(new CustomEvent('delab-preview', { detail: 'card' }))">card</button>
    <button data-target="button" onclick="window.dispatchEvent(new CustomEvent('delab-preview', { detail: 'button' }))">button</button>
    <button onclick="window.dispatchEvent(new CustomEvent('delab-preview', { detail: 'reset' }))">Reset all</button>
  </div>

  <script src="preview.js"></script>
</body>
</html>
